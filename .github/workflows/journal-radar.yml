name: Update Journal Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1,13 * * *'
  push:
    branches: [main]
    paths: ['radar/**', '.github/workflows/journal-radar.yml', 'src/paper_firehose/core/**', 'package*.json', '.prettier*']

concurrency:
  group: journal-radar-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pages: write
    outputs:
      collection-outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: radar/dev-requirements.txt
      - name: Install lightweight dependencies
        run: python -m pip install -r radar/dev-requirements.txt
      - name: Check Python formatting
        run: ruff format --check radar
      - name: Verify collection behavior
        run: python -m pytest radar/test_radar.py radar/test_desktop.py radar/test_abstracts.py radar/test_archives.py radar/test_library.py radar/test_site_data.py radar/test_snapshots.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install formatting tools
        run: npm ci --ignore-scripts
      - name: Check frontend formatting
        run: npm run format:check
      - name: Verify translation caching and quota behavior
        run: node --test radar/test_translation.cjs radar/test_archives_ui.cjs radar/test_reading.cjs radar/test_feed.cjs radar/test_library.cjs radar/test_citations.cjs radar/test_data.cjs radar/test_backup.cjs radar/test_sw.cjs
      - name: Restore verified durable history
        run: python radar/snapshots.py restore
      - name: Collect journals and build reading site
        id: collect
        continue-on-error: true
        run: python radar/run.py sync --days 90 --workers 3
      - name: Supplement missing abstracts with OpenAlex
        run: python radar/abstracts.py --limit 1000
      - name: Verify generated data after abstract enrichment
        run: python radar/verify_site.py
      - name: Publish and verify durable history
        run: python radar/snapshots.py publish --tag radar-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save snapshot pointer to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          STATE_DIR="$RUNNER_TEMP/radar-state"
          git fetch origin main
          git worktree add --detach "$STATE_DIR" FETCH_HEAD
          mkdir -p "$STATE_DIR/state"
          cp state/snapshot.json "$STATE_DIR/state/snapshot.json"
          git -C "$STATE_DIR" add state/snapshot.json
          git -C "$STATE_DIR" commit -m 'Update journal snapshot pointer'
          for attempt in 1 2 3; do
            if git -C "$STATE_DIR" push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git -C "$STATE_DIR" fetch origin main
            git -C "$STATE_DIR" rebase FETCH_HEAD
          done
      - name: Retain recent recovery snapshots
        run: python radar/snapshots.py prune
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Write source summary
        run: python radar/verify_site.py --summary
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report total collection failure after publishing health
        if: needs.collect.outputs.collection-outcome == 'failure'
        run: exit 1
