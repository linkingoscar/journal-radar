name: Update Journal Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1,13 * * *'
  push:
    branches: [main]
    paths: ['radar/**', '.github/workflows/journal-radar.yml', 'src/paper_firehose/core/**']

concurrency:
  group: journal-radar-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    outputs:
      collection-outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: radar/requirements.txt
      - name: Install lightweight dependencies
        run: python -m pip install -r radar/requirements.txt pytest==8.4.2
      - name: Verify collection behavior
        run: python -m pytest radar/test_radar.py radar/test_desktop.py radar/test_abstracts.py radar/test_archives.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify translation caching and quota behavior
        run: node --test radar/test_translation.cjs
      - name: Restore durable history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p radar-data
          if git ls-remote --exit-code --heads origin radar-history >/dev/null 2>&1; then
            git fetch origin radar-history
            git show FETCH_HEAD:state/history.db.gz > radar-data/history.db.gz
            python -c "import gzip,pathlib; p=pathlib.Path('radar-data'); (p/'history.db').write_bytes(gzip.decompress((p/'history.db.gz').read_bytes()))"
          fi
      - name: Collect journals and build reading site
        id: collect
        continue-on-error: true
        run: python radar/run.py sync --days 90 --workers 3
      - name: Supplement missing abstracts with OpenAlex
        run: python radar/abstracts.py --limit 1000
      - name: Verify generated data after abstract enrichment
        run: python radar/verify_site.py
      - name: Save history to radar-history branch
        shell: bash
        run: |
          set -euo pipefail
          python -c "import gzip,pathlib; p=pathlib.Path('radar-data'); (p/'history.db.gz').write_bytes(gzip.compress((p/'history.db').read_bytes(),mtime=0))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          STATE_DIR="$RUNNER_TEMP/radar-state"
          if git ls-remote --exit-code --heads origin radar-history >/dev/null 2>&1; then
            git fetch origin radar-history
            git worktree add --detach "$STATE_DIR" FETCH_HEAD
          else
            git worktree add --detach "$STATE_DIR" HEAD
            git -C "$STATE_DIR" checkout --orphan radar-state
            git -C "$STATE_DIR" rm -rf .
          fi
          mkdir -p "$STATE_DIR/state"
          cp radar-data/history.db.gz "$STATE_DIR/state/history.db.gz"
          python -c "import json,pathlib; d=json.loads(pathlib.Path('site/data.json').read_text()); pathlib.Path('radar-data/last-run.json').write_text(json.dumps({'generated_at':d['generated_at'],'journals':len(d['journals']),'articles':len(d['articles'])}))"
          cp radar-data/last-run.json "$STATE_DIR/state/last-run.json"
          git -C "$STATE_DIR" add state
          if ! git -C "$STATE_DIR" diff --cached --quiet; then
            git -C "$STATE_DIR" commit -m 'Update journal collection history'
            git -C "$STATE_DIR" push origin HEAD:radar-history
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Write source summary
        run: python radar/verify_site.py --summary
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report total collection failure after publishing health
        if: needs.collect.outputs.collection-outcome == 'failure'
        run: exit 1
